<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop registration</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ec;color:#283b36;font:16px/1.5 system-ui,sans-serif}main{max-width:720px;margin:0 auto;padding:24px}h1{font-size:30px;line-height:1.15;margin:12px 0}p{margin:12px 0}.panel{background:#ffffff;border:1px solid #77877e;padding:20px;border-radius:10px}label{display:block;font-weight:650}input{display:block;width:100%;font:inherit;padding:10px;background:#fff;color:#283b36;border:2px solid #77877e;margin:6px 0 14px}button{font:inherit;font-weight:650;background:#245747;color:#fff;border:2px solid #245747;padding:10px 18px;border-radius:5px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #9a3e18;outline-offset:3px}#status{padding:10px 0;font-weight:650}#status[data-state=error]{color:#a12f23}#status[data-state=success]{color:#245747}[hidden]{display:none}
</style><main><p id="eyebrow">COMMUNITY WORKSHOP</p><h1 id="title">Make something together.</h1><p id="intro">Reserve a place at Saturday’s practical repair session.</p><form class="panel" novalidate><label id="email-label" for="email">Email address</label><input id="email" type="email" autocomplete="email" aria-describedby="status"><button id="reserve" type="submit">Reserve a place</button><p id="status" role="status" hidden></p></form><p id="note">A hands-on session for beginners. Bring one small item to repair.</p></main><script>
const form=document.querySelector('form'),email=document.querySelector('#email'),status=document.querySelector('#status');form.addEventListener('submit',e=>{e.preventDefault();status.hidden=false;if(!email.validity.valid||!email.value){status.dataset.state='error';status.textContent='Error: enter a valid email address.';email.setAttribute('aria-invalid','true');email.focus()}else{status.dataset.state='success';status.textContent='Confirmed: your example reservation is ready.';email.removeAttribute('aria-invalid')}});
</script></html>
